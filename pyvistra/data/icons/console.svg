<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Terminal window -->
  <rect x="2" y="3" width="20" height="18" rx="2.5" 
        fill="#e0e0e0" fill-opacity="0.06" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Title bar dots -->
  <circle cx="5.5" cy="6.5" r="1" fill="#e0e0e0" fill-opacity="0.3"/>
  <circle cx="8.5" cy="6.5" r="1" fill="#e0e0e0" fill-opacity="0.3"/>
  <circle cx="11.5" cy="6.5" r="1" fill="#e0e0e0" fill-opacity="0.3"/>
  <!-- Prompt chevron -->
  <polyline points="6,13 9,15.5 6,18" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor line -->
  <line x1="12" y1="18" x2="18" y2="18" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
