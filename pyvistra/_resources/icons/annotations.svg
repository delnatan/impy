        fill="#e0e0e0" fill-opacity="0.06" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- List rows -->
  <line x1="6" y1="7" x2="14" y2="7" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="12" x2="14" y2="12" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="17" x2="11" y2="17" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tag/label badge -->
  <rect x="16" y="13" width="6" height="6" rx="1.5" fill="#e0e0e0" fill-opacity="0.2" stroke="#e0e0e0" stroke-width="1.2"/>
  <circle cx="19" cy="16" r="0.8" fill="#e0e0e0"/>
