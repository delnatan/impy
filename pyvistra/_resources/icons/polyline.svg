<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Multi-segment polyline -->
  <polyline points="4,17 8,8 13,13 20,5"
            fill="none" stroke="#e0e0e0" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 2.5"/>
  <!-- Editable vertices -->
  <circle cx="4" cy="17" r="2" fill="#e0e0e0"/>
  <circle cx="8" cy="8" r="2" fill="#e0e0e0"/>
  <circle cx="13" cy="13" r="2" fill="#e0e0e0"/>
  <circle cx="20" cy="5" r="2" fill="#e0e0e0"/>
  <!-- Active segment hint -->
  <line x1="13" y1="13" x2="20" y2="5"
        stroke="#e0e0e0" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.28"/>
</svg>
